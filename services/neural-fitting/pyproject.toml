[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "drape-neural-fitting"
version = "0.1.0"
description = "Drape Neural Fitting Worker Service on Modal"
readme = "AGENTS.md"
requires-python = ">=3.11"
dependencies = [
    "modal>=0.60.0",
    "fastapi>=0.110.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v"
filterwarnings = [
    "ignore::DeprecationWarning:modal.*",
    "ignore::DeprecationWarning:pytest_asyncio.*",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
