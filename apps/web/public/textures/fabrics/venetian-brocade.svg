<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="brocade-base" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3D2E14"/>
      <stop offset="40%" stop-color="#5C451D"/>
      <stop offset="80%" stop-color="#2D210D"/>
      <stop offset="100%" stop-color="#1F1607"/>
    </linearGradient>
    <linearGradient id="venetian-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEBB0"/>
      <stop offset="45%" stop-color="#D4AF37"/>
      <stop offset="75%" stop-color="#AA8012"/>
      <stop offset="100%" stop-color="#705206"/>
    </linearGradient>
    <pattern id="damask-brocade" width="100" height="100" patternUnits="userSpaceOnUse">
      <!-- Central Baroque Palmette / Acanthus -->
      <path d="M50 10 C45 25 35 30 25 35 C35 45 42 42 50 60 C58 42 65 45 75 35 C65 30 55 25 50 10 Z" fill="url(#venetian-gold)" fill-opacity="0.85"/>
      <path d="M50 60 C38 68 30 78 35 90 C45 85 48 78 50 72 C52 78 55 85 65 90 C70 78 62 68 50 60 Z" fill="url(#venetian-gold)" fill-opacity="0.7"/>
      <!-- Filigree scrolls -->
      <path d="M10 50 C20 40 30 45 35 55 C28 65 18 60 10 50 Z" fill="url(#venetian-gold)" fill-opacity="0.6"/>
      <path d="M90 50 C80 40 70 45 65 55 C72 65 82 60 90 50 Z" fill="url(#venetian-gold)" fill-opacity="0.6"/>
      <!-- Floral corner accents -->
      <circle cx="0" cy="0" r="10" fill="url(#venetian-gold)" fill-opacity="0.5"/>
      <circle cx="100" cy="0" r="10" fill="url(#venetian-gold)" fill-opacity="0.5"/>
      <circle cx="0" cy="100" r="10" fill="url(#venetian-gold)" fill-opacity="0.5"/>
      <circle cx="100" cy="100" r="10" fill="url(#venetian-gold)" fill-opacity="0.5"/>
      <!-- Micro metallic weft stippling -->
      <line x1="0" y1="25" x2="100" y2="25" stroke="#FFEBB0" stroke-width="0.5" stroke-dasharray="1 3"/>
      <line x1="0" y1="75" x2="100" y2="75" stroke="#FFEBB0" stroke-width="0.5" stroke-dasharray="1 3"/>
    </pattern>
    <radialGradient id="brocade-luster" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFEBB0" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#000000" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.6"/>
    </radialGradient>
  </defs>
  <rect width="400" height="400" fill="url(#brocade-base)"/>
  <rect width="400" height="400" fill="url(#damask-brocade)"/>
  <rect width="400" height="400" fill="url(#brocade-luster)"/>
  <rect width="400" height="400" fill="none" stroke="#D4AF37" stroke-width="1.5" stroke-opacity="0.4"/>
</svg>