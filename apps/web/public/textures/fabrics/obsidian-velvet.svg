<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="velvet-sheen" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#282B36"/>
      <stop offset="35%" stop-color="#181A22"/>
      <stop offset="70%" stop-color="#0F1015"/>
      <stop offset="100%" stop-color="#08090C"/>
    </radialGradient>
    <pattern id="velvet-pile" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="6" r="4.5" fill="#1C1E26" fill-opacity="0.8"/>
      <circle cx="0" cy="0" r="3" fill="#15171E" fill-opacity="0.6"/>
      <circle cx="12" cy="12" r="3" fill="#15171E" fill-opacity="0.6"/>
      <circle cx="6" cy="6" r="1.5" fill="#3A3E4E" fill-opacity="0.4"/>
    </pattern>
    <linearGradient id="velvet-drape-folds" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="20%" stop-color="#000000" stop-opacity="0.4"/>
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="65%" stop-color="#000000" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.06"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#velvet-sheen)"/>
  <rect width="400" height="400" fill="url(#velvet-pile)"/>
  <rect width="400" height="400" fill="url(#velvet-drape-folds)"/>
  <rect width="400" height="400" fill="none" stroke="#3A3E4E" stroke-width="1" stroke-opacity="0.25"/>
</svg>