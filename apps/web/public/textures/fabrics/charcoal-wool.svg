<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="wool-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D2F35"/>
      <stop offset="50%" stop-color="#222429"/>
      <stop offset="100%" stop-color="#1B1C20"/>
    </linearGradient>
    <pattern id="crepe-weave" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#24262C"/>
      <rect x="0" y="0" width="4" height="4" fill="#363942"/>
      <rect x="4" y="4" width="4" height="4" fill="#31333B"/>
      <line x1="0" y1="2" x2="8" y2="2" stroke="#1D1E22" stroke-width="0.7"/>
      <line x1="2" y1="0" x2="2" y2="8" stroke="#1D1E22" stroke-width="0.7"/>
    </pattern>
    <filter id="wool-noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.6" numOctaves="3" result="noise"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.55  0 0 0 0.08 0" in="noise" result="coloredNoise"/>
      <feComposite in="SourceGraphic" in2="coloredNoise" operator="over"/>
    </filter>
  </defs>
  <rect width="400" height="400" fill="url(#wool-bg)"/>
  <rect width="400" height="400" fill="url(#crepe-weave)" filter="url(#wool-noise)"/>
  <rect width="400" height="400" fill="none" stroke="#484C58" stroke-width="1" stroke-opacity="0.3"/>
</svg>