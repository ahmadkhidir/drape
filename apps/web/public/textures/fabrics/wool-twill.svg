<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="twill-navy-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E232E"/>
      <stop offset="50%" stop-color="#161A23"/>
      <stop offset="100%" stop-color="#10131A"/>
    </linearGradient>
    <pattern id="heavy-twill" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="12" height="12" fill="#161A23"/>
      <line x1="0" y1="0" x2="12" y2="0" stroke="#2B3242" stroke-width="2.5"/>
      <line x1="0" y1="6" x2="12" y2="6" stroke="#12151D" stroke-width="1.8"/>
    </pattern>
  </defs>
  <rect width="400" height="400" fill="url(#twill-navy-bg)"/>
  <rect width="400" height="400" fill="url(#heavy-twill)"/>
  <rect width="400" height="400" fill="none" stroke="#2B3242" stroke-width="1" stroke-opacity="0.3"/>
</svg>