<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="chiffon-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCFAF7"/>
      <stop offset="50%" stop-color="#F2ECE4"/>
      <stop offset="100%" stop-color="#E8DFD3"/>
    </linearGradient>
    <pattern id="chiffon-mesh-fine" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#F2ECE4" fill-opacity="0.8"/>
      <line x1="0" y1="3" x2="6" y2="3" stroke="#D5C5B1" stroke-width="0.75" stroke-opacity="0.5"/>
      <line x1="3" y1="0" x2="3" y2="6" stroke="#D5C5B1" stroke-width="0.75" stroke-opacity="0.5"/>
    </pattern>
  </defs>
  <rect width="400" height="400" fill="url(#chiffon-bg)"/>
  <rect width="400" height="400" fill="url(#chiffon-mesh-fine)"/>
  <rect width="400" height="400" fill="none" stroke="#C5A059" stroke-width="1" stroke-opacity="0.2"/>
</svg>