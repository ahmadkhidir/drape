<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="linen-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EBE5D8"/>
      <stop offset="40%" stop-color="#E2DACB"/>
      <stop offset="70%" stop-color="#DBD2C1"/>
      <stop offset="100%" stop-color="#E5DECf"/>
    </linearGradient>
    <pattern id="linen-slub" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect width="24" height="24" fill="#E2DACB"/>
      <line x1="0" y1="4" x2="24" y2="4" stroke="#B8AC99" stroke-width="1.8" stroke-dasharray="8 3 10 3"/>
      <line x1="0" y1="12" x2="24" y2="12" stroke="#FAF7F2" stroke-width="1.2" stroke-dasharray="12 4 6 2"/>
      <line x1="0" y1="20" x2="24" y2="20" stroke="#C9BEAC" stroke-width="1.6" stroke-dasharray="6 4 11 3"/>
      <line x1="4" y1="0" x2="4" y2="24" stroke="#B8AC99" stroke-width="1.5" stroke-dasharray="10 2 8 4"/>
      <line x1="12" y1="0" x2="12" y2="24" stroke="#FAF7F2" stroke-width="1.0" stroke-dasharray="5 3 12 4"/>
      <line x1="20" y1="0" x2="20" y2="24" stroke="#C9BEAC" stroke-width="1.8" stroke-dasharray="9 4 7 4"/>
    </pattern>
    <filter id="slub-grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.25 0.05" numOctaves="2" result="slubNoise"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.6  0 0 0 0 0.55  0 0 0 0 0.45  0 0 0 0.1 0" in="slubNoise" result="slubTex"/>
      <feComposite in="SourceGraphic" in2="slubTex" operator="over"/>
    </filter>
  </defs>
  <rect width="400" height="400" fill="url(#linen-bg)"/>
  <rect width="400" height="400" fill="url(#linen-slub)" filter="url(#slub-grain)"/>
  <rect width="400" height="400" fill="none" stroke="#C5A059" stroke-width="1" stroke-opacity="0.2"/>
</svg>