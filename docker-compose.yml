version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: drape-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-drape}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-drape}
      POSTGRES_DB: ${POSTGRES_DB:-drape_core}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U drape -d drape_core']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: drape-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: drape-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-drape}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-drape}
      RABBITMQ_DEFAULT_VHOST: /
    ports:
      - '5672:5672'
      - '15672:15672'
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 10s
      retries: 5

  neural-fitting:
    build:
      context: ./services/neural-fitting
      dockerfile: Dockerfile
    container_name: drape-neural-fitting
    restart: unless-stopped
    environment:
      AMQP_URL: amqp://drape:drape@rabbitmq:5672/
      ENABLE_AMQP: 'true'
      PORT: 8000
      HOST: '0.0.0.0'
      MEDIA_STORAGE_PATH: /data/media
    ports:
      - '8000:8000'
    volumes:
      - shared_media:/data/media
    depends_on:
      rabbitmq:
        condition: service_healthy

  core:
    build:
      context: .
      dockerfile: services/core/Dockerfile
    container_name: drape-core
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://drape:drape@postgres:5432/drape_core
      REDIS_URL: redis://redis:6379
      AMQP_URL: amqp://drape:drape@rabbitmq:5672/
      PORT: 4000
      HOST: '0.0.0.0'
      NODE_ENV: production
      MEDIA_DIR: /data/media
    ports:
      - '4000:4000'
    volumes:
      - shared_media:/data/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      neural-fitting:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: drape-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      CORE_API_URL: http://core:4000
      NEXT_PUBLIC_CORE_API_URL: http://localhost:4000
    ports:
      - '3000:3000'
    volumes:
      - shared_media:/app/apps/web/public/media
    depends_on:
      - core

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  shared_media:
